[workspace]
resolver = "3"
members = ["crates/hearth-audio", "crates/hearth-core", "crates/hearth-platform", "crates/hearth-shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
hearth-core = { path = "crates/hearth-core" }
hearth-platform = { path = "crates/hearth-platform" }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
gilrs = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "qoi"] }
nix = { version = "0.31", features = ["signal", "process", "fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
ureq = { version = "3", features = ["json"] }
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48", default-features = false }
walkdir = "2.5"
x11rb = "0.14"
zbus = "6.0.0"
slint = { version = "1.18", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
slint-build = "1.18"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

# Art decoding and resizing in debug builds: unoptimised, these are 10-30x slower and art shows
# seconds late. Only these crates; Hearth's own code stays debuggable.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.qoi]
opt-level = 3
# The controller drawing (resvg) and text layout/rendering in debug builds: unoptimised, a
# controls page took 290 ms to open and moves lagged; with these, ~80 ms and one frame.
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.femtovg]
opt-level = 3
[profile.dev.package.i-slint-renderer-femtovg]
opt-level = 3
[profile.dev.package.i-slint-core]
opt-level = 3
