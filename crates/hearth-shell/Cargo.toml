[package]
name = "hearth-shell"
description = "Hearth's Slint user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "hearth-shell"

[[bin]]
name = "hearth-shell"
path = "src/main.rs"

# Hands the controllers back to InputPlumber if Hearth dies (see src/guard.rs).
[[bin]]
name = "hearth-guard"
path = "src/bin/hearth-guard.rs"

[dependencies]
serde.workspace = true
toml.workspace = true
hearth-core.workspace = true
hearth-platform.workspace = true
nix.workspace = true
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
clap.workspace = true
slint.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
usvg.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
