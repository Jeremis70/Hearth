# Systems Hearth knows about.
# A game's system comes from the folder it is in, never from the extension alone: GameCube and
# Wii share .iso and .rvz.
# TODO(M2): generated from ES-DE's es_systems.xml + es_find_rules.xml by tools/import-esde.

[[system]]
id = "n64"
name = "Nintendo 64"
short = "N64"
extensions = ["z64", "n64", "v64"]
folders = ["n64"]
default_emulator = "retroarch"
# Freeze the emulator with SIGSTOP while the overlay or Home is shown.
suspend = "sigstop"

  # Controls a mapping can bind to (data/controls/n64.toml). C-up..C-right are also driven by
  # the "C-buttons" stick.
  [system.controls]
  buttons = ["A", "B", "Z", "L", "R", "Start", "C-up", "C-down", "C-left", "C-right"]
  sticks = ["Stick", "C-buttons"]
  dpads = ["D-pad"]

  [[system.emulator]]
  id = "retroarch"
  kind = "retroarch"
  core = "/usr/lib/libretro/mupen64plus_next_libretro.so"

[[system]]
id = "gc"
name = "Nintendo GameCube"
short = "GameCube"
extensions = ["iso", "rvz", "gcz", "ciso", "gcm"]
folders = ["gc", "gamecube"]
default_emulator = "dolphin"
suspend = "sigstop"

  [system.controls]
  buttons = ["A", "B", "X", "Y", "Z", "Start"]
  triggers = ["L", "R"]
  sticks = ["Main stick", "C-stick"]
  dpads = ["D-pad"]

  [[system.emulator]]
  id = "dolphin"
  kind = "dolphin"

# Listed so Wii games show up and launch; Wiimote emulation isn't set up yet.
[[system]]
id = "wii"
name = "Nintendo Wii"
short = "Wii"
extensions = ["iso", "rvz", "wbfs", "wad"]
folders = ["wii"]
default_emulator = "dolphin"
suspend = "sigstop"

  [[system.emulator]]
  id = "dolphin"
  kind = "dolphin"
